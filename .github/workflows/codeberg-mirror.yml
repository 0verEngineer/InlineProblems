name: Codeberg Mirror

# The action pushes every ref anyway, and a Dependabot triggered run has no access to the
# repository secrets, so its push cannot authenticate.
on:
  push:
    branches:
      - main
      - release

jobs:
  codeberg-mirror:
    name: Codeberg Mirror
    runs-on: ubuntu-latest
    steps:
      # Pinned instead of @master: the action runs with the Codeberg credentials
      - uses: yesolutions/mirror-action@v0.7.0
        with:
          REMOTE: 'https://codeberg.org/OverEngineer/InlineProblems'
          GIT_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          GIT_PASSWORD: ${{ secrets.CODEBERG_TOKEN }}
