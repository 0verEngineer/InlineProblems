pluginGroup = org.OverEngineer
pluginName = InlineProblems
pluginRepositoryUrl = https://github.com/0verEngineer/InlineProblems
# SemVer format -> https://semver.org
pluginVersion = 0.5.10

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 251
pluginUntilBuild =

# JUnit 5, used by the UI tests (testIdeUi) and by future unit tests
junitVersion = 5.11.4

# Java version the sources are compiled against, dictated by the platform baseline
javaVersion = 21

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-extension.html
platformType = IC
#platformType = RD
platformVersion = 2025.1.7
#platformVersion = 2025.2.3

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
platformPlugins =

# IDE build the IntelliJ Plugin Verifier checks against (verifyPlugin).
# Only the latest release: the sources are compiled against platformVersion, so the lower bound is
# already covered by the compiler, and what the verifier adds is catching API that disappeared in a
# newer IDE. See the comment on the task in build.gradle.kts.
# Note the IU prefix: IntelliJ IDEA Community is not published separately any more starting with
# 2025.3 (253), Community and Ultimate ship as one distribution.
# Bump this when a new IDE version is released - `./gradlew printProductsReleases` prints the
# currently available builds, newest first. A comma separated list is supported.
pluginVerifierIdeVersions = IU-2025.3

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.7.1

# Opt-out flag for bundling Kotlin standard library -> https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library
# suppress inspection "UnusedProperty"
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
# suppress inspection "UnusedProperty"
org.gradle.configuration-cache = true
